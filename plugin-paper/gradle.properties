# NOTE: Gradle reads gradle.properties as ISO-8859-1, so this file must stay
#       pure ASCII. Chinese paths are written with \uXXXX escapes (Java
#       properties syntax) -- e.g. the MythicMobs path below.

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Compile with the JDK 17 bundled in this workspace (Paper 1.20.1 needs Java 17)
org.gradle.java.home=E:/jdk-17.0.20.1+1

# ---- compile-time dependencies -------------------------------------------
# Paper API from https://repo.papermc.io/
paper_api_version=1.20.1-R0.1-SNAPSHOT

# MythicMobs is a premium plugin (not on any public repo), so we compile against
# the copy that is already installed on the server. Change this one line after
# moving machines or upgrading MythicMobs. Compile-only: never bundled into our jar.
#   E:/Minecraft/<server-dir>/<service-dir>/plugins/MythicMobs-5.6.2.jar
mythicmobs_jar=E:/Minecraft/\u670d\u52a1\u5668/\u65f6\u65c5\u670d\u52a1\u7aef/plugins/MythicMobs-5.6.2.jar

# The plugin's own version is NOT here: it lives in src/main/resources/plugin.yml
# (build.gradle reads it to name the artifact MMmap-Plugin-<version>.jar).
