# StarTrail 区域配置默认模板(v1.9.6+)
#
# v1.9.6 起仅支持多边形区域（矩形系统已移除，多边形可表达任意矩形）。
# 配置放在文件夹: plugins/StarTrail/regions/*.yml
#   - 单个 yml 可放一个或多个多边形
#   - 单个 yml 单区域: 顶层直接是字段(name/world/... 见下), id = 文件名(不含 .yml)
#   - 单个 yml 多区域: 顶层用一个段(段名随便, 比如 polygons: 或 towns:), 段下每个 key 是一个区域,
#                      id = "<file>.<段内 key>", 避免不同文件 id 冲突
#
# 文件名自己取, 不影响加载(只要 .yml 后缀)。
# 修改后执行 /startrail reload 即可推送给客户端；/startrail list [世界] 可查看当前已加载的区域。
#
# 字段说明:
#   id:           唯一标识 (单区域模式 = 文件名; 多区域模式 = "<file>.<key>")
#   shape:        polygon（或直接包含 polygon: 顶点列表）
#   name:         显示在地图上的名字
#   world:        世界名(Bukkit 短名, 如 "world")
#   polygon:      多边形顶点 [{x, z}, {x, z}, ...], 至少 3 个
#   lineColor / fillColor / showLine / fillEnabled: 渲染相关（颜色支持 0xRRGGBB / 0xAARRGGBB / #RRGGBB）
#   enter-commands: 进入该区域时执行的命令列表
#     命令规则:
#       - 不要带开头的 /
#       - 用 < 开头表示以玩家身份执行(player.performCommand)
#       - 不带 < 开头表示以控制台身份执行
#       - 占位符: {player} 玩家名, {uuid} UUID, {region} 区域ID, {name} 区域名, {world} 世界名
#       - 示例: ['tellraw {player} 你进入了 {name}', '<spawn']
#
# === 示例 1: 单区域文件 spawn-zone.yml ===
# name: "新手村"
# shape: polygon
# world: "world"
# lineColor: 0x8800FF00
# fillColor: 0x2200FF00
# showLine: true
# fillEnabled: true
# polygon:
#   - {x: -50, z: -50}
#   - {x: 50, z: -50}
#   - {x: 50, z: 50}
#   - {x: -50, z: 50}
# enter-commands:
#   - 'tellraw {player} 你进入了 {name}'
#
# === 示例 2: 多区域文件 towns.yml（段名任意，此处用 polygons:） ===
# polygons:
#   capital:
#     name: "王城"
#     world: "world"
#     lineColor: 0x88FFD700
#     fillColor: 0x22FFD700
#     polygon:
#       - {x: -100, z: -100}
#       - {x: 100, z: -100}
#       - {x: 100, z: 100}
#       - {x: -100, z: 100}
#   mine:
#     name: "矿场"
#     world: "world"
#     lineColor: 0x88FF0000
#     polygon:
#       - {x: 500, z: 500}
#       - {x: 600, z: 500}
#       - {x: 600, z: 600}
#       - {x: 500, z: 600}
