name: StarTrail
version: '1.0.0'
main: com.asterovie.momo.startrail.server.StarTrailPlugin
api-version: '1.20'
authors: ['星野尘梦工作室 · 默默']
description: 星轨 — 大地图、小地图、区域与点位导航
softdepend: [MythicMobs]

commands:
  startrail:
    description: 星轨主命令
    usage: /<command> <list|info|reload|map|tp|warp|help>
    permission: startrail.command
    aliases: [st, trail, map, minimap]

permissions:
  startrail.command:
    description: 允许使用星轨命令
    default: op
  startrail.command.reload:
    description: 允许重载配置
    default: op
  startrail.command.tp:
    description: 允许大地图传送（右键传送到坐标 / /startrail warp tp）
    default: op
