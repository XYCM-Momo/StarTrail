region-coords: "&7坐标: ({0}, {1}) -> ({2}, {3})"
# {0} = 类型显示名
region-type: "&7类型: {0}"
region-migrate-warn: "&e⚠ v1.7.2+ 区域配置已迁到 plugins/MMmap/regions/*.yml 多文件, 此命令仅临时写入内存, 重启后丢失"
region-migrate-warn2: "&e  请手动把此区域追加到 regions/<文件名>.yml(顶层字段或 warps/regions 段下)以持久化"
region-create-fail: "&c创建区域失败，ID已存在"
region-remove-usage: "&c用法: /mmap remove <区域ID>"
# {0} = 用户输入的区域ID
region-not-found: "&c未找到区域: {0}"
# {0} = 区域名称
region-deleted: "&a区域 '{0}' 已删除"
region-delete-migrate-warn: "&e⚠ 同样请手动从 regions/*.yml 删除该条以持久化"
region-delete-fail: "&c删除区域失败"
# {0} = 世界名
region-list-world: "&e世界 '{0}' 的区域列表:"
region-list-all: "&e所有区域列表:"
region-list-empty: "&7暂无区域"
# {0} = 区域数量
region-list-count: "&7共 {0} 个区域"
region-info-usage: "&c用法: /mmap info <区域ID>"
region-info-title: "&e=== 区域信息 ==="
# {0} = 区域ID
region-info-id: "&bID: &f{0}"
# {0} = 区域名称
region-info-name: "&b名称: &f{0}"
# {0} = 世界名
region-info-world: "&b世界: &f{0}"
region-info-bounds: "&b坐标范围:"
# {0} = minX  {1} = maxX
region-info-x: "&7  X: {0} ~ {1}"
# {0} = minZ  {1} = maxZ
region-info-z: "&7  Z: {0} ~ {1}"
# {0} = minY  {1} = maxY
region-info-y: "&7  Y: {0} ~ {1}"
# {0} = 类型显示名
region-info-type: "&b类型: &f{0}"
# {0} = 面积数值
region-info-area: "&b面积: &f{0} 方块"
# {0} = 描述文本
region-info-desc: "&b描述: &f{0}"

