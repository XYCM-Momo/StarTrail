# MMmap 语言配置文件
# 颜色代码: &c=红 &a=绿 &e=黄 &b=青 &7=灰 &f=白 &6=金 &r=重置
# 占位符 {0} {1} {2} {3} 按下方注释说明替换
# 修改后执行 /mmap reload 即可生效

# === 通用 ===
# {0} = 用户输入的命令名
unknown-command: "&c未知命令: {0}"
player-only: "&c只有玩家可以使用此命令"
coord-must-number: "&c坐标必须是数字"

# === 区域命令 ===
region-add-usage: "&c用法: /mmap add <名称> <x1> <z1> <x2> <z2> [类型]"
region-type-list: "&7类型: NORMAL, SAFE, DANGER, CUSTOM (默认: NORMAL)"
# {0} = 用户输入的类型名
region-invalid-type: "&c无效的区域类型: {0}"
# {0} = 区域名称
region-created: "&a区域 '{0}' 已成功创建！"
# {0} = 区域ID
region-id: "&7ID: {0}"
